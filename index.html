<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Free IngeTrazo plugins for modellers, plugin video tutorials, and the EssexBrick Model Railway - nearly 100% 3D printed. Build in the real world, print in the scale world."><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>EssexBrick Model Works</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style id="css">/* Layout: slim works-plate header with a five-page menu; each page is its own view (Home, Plugins, Videos, My Layout, About). Maroon is kept for the header and accents; content sits on a light ground. */
:root{
  --bg:#F3F1EF; --surface:#FFFFFF; --sunk:#E9E5E2; --ink:#221C1D; --muted:#655B5D; --line:#DDD6D3;
  --maroon:#6E1E28; --maroon-deep:#4C121A; --gold:#C79A2E; --gold-soft:#E6C670; --on-maroon:#F6E7C1;
  --accent-ink:#6E1E28; --pic-bg:#F4F3F1;
  --rail:#3E6B57; --plug:#2F5F8A; --model:#8A5A2B;
  --display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171213; --surface:#221B1C; --sunk:#1C1617; --ink:#F1E9E6; --muted:#B3A6A5; --line:#3A3031;
  --maroon:#7E2632; --maroon-deep:#3A0E14; --gold:#D9AE45; --gold-soft:#E8CC80; --on-maroon:#F6E7C1;
  --accent-ink:#E8CC80;
  --rail:#7FB89C; --plug:#7FB0DD; --model:#D49C62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171213; --surface:#221B1C; --sunk:#1C1617; --ink:#F1E9E6; --muted:#B3A6A5; --line:#3A3031;
  --maroon:#7E2632; --maroon-deep:#3A0E14; --gold:#D9AE45; --gold-soft:#E8CC80; --on-maroon:#F6E7C1;
  --accent-ink:#E8CC80;
  --rail:#7FB89C; --plug:#7FB0DD; --model:#D49C62; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a,button,.chip{cursor:pointer}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--maroon-deep)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--maroon-deep);color:var(--on-maroon);border-bottom:3px solid var(--gold)}
.top .wrap{display:flex;align-items:center;gap:12px 28px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--on-maroon)}
.mini-plate{width:92px;aspect-ratio:2/1.15;border-radius:50%;background:var(--maroon);border:3px solid var(--gold);box-shadow:inset 0 0 0 2px var(--maroon),inset 0 0 0 3px var(--gold-soft);display:grid;place-items:center;text-align:center;flex:none}
.mini-plate span{font-family:var(--display);color:var(--gold-soft);font-size:.62rem;line-height:1.05;letter-spacing:.02em}
.mini-plate b{display:block;font-weight:400;font-size:.8rem}
.brand-name{font-family:var(--cond);font-weight:700;font-size:1.25rem;letter-spacing:.03em;line-height:1.1}
.brand-name small{display:block;font-weight:500;font-size:.85rem;color:var(--gold-soft);letter-spacing:.04em}
.menu{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%}
.menu::-webkit-scrollbar{display:none}
.menu a{font-family:var(--cond);font-weight:600;font-size:1.05rem;letter-spacing:.04em;text-decoration:none;padding:8px 14px;border-radius:6px;color:var(--on-maroon);white-space:nowrap}
.menu a:hover{background:color-mix(in oklab,var(--on-maroon) 12%,transparent)}
.menu a[aria-current="page"]{background:var(--gold);color:var(--maroon-deep)}
@media (max-width:760px){.menu{margin-left:0;width:100%;justify-content:space-between;gap:2px}.menu a{padding:6px 6px;font-size:.95rem;letter-spacing:.02em}.route .media{aspect-ratio:16/6}}

/* Pages */
main{min-height:60vh}
.page{padding-block:36px 56px}
.page-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px;margin-bottom:24px}
.eyebrow{font-family:var(--cond);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.85rem;color:var(--accent-ink)}
h1.pt{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,4vw,2.6rem);line-height:1.1;margin-top:4px}
h2{font-family:var(--cond);font-weight:700;font-size:1.5rem;letter-spacing:.01em;line-height:1.2}
.sub{color:var(--muted);margin-top:8px;max-width:62ch}
.block{margin-top:40px}
.block > h2{margin-bottom:14px}

.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;font-weight:600;background:var(--maroon);color:#FBF3E4;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--maroon-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.gold:hover{background:var(--gold-soft)}
.btn.small{padding:5px 10px;font-size:.88rem;border-radius:6px}
.btn.danger{background:#A3262F;color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.textlink{color:var(--accent-ink);font-weight:600;text-decoration:none}
.textlink:hover{text-decoration:underline}

.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;font-family:var(--cond);font-weight:600;font-size:1rem;letter-spacing:.03em;display:inline-flex;gap:7px;align-items:center}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.search,.pick{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.search{flex:1 1 200px;max-width:300px}
.pick{max-width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:20px}

.badge{flex:none;white-space:nowrap;font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.75rem;padding:2px 7px;border-radius:4px;color:var(--surface)}
.badge.railway{background:var(--rail)} .badge.plugins{background:var(--plug)} .badge.modelling{background:var(--model)}
.badge.free{background:var(--gold);color:#2a1d00}

/* Video cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px 18px}
.vcard{display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{position:relative;display:block;aspect-ratio:16/9;max-width:100%;border-radius:8px;overflow:hidden;background:var(--maroon-deep)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;
  background:linear-gradient(135deg,var(--maroon-deep),var(--maroon))}
.thumb .ph span{font-family:var(--display);color:var(--gold-soft);font-size:1rem;line-height:1.1;border:3px solid var(--gold);border-radius:50%;padding:10px 22px;background:var(--maroon)}
.thumb .play{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:rgb(0 0 0 / .65);display:grid;place-items:center}
.thumb .play::after{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.thumb:hover .play{background:#C4302B}
.vcard h3{font-family:var(--body);font-weight:700;font-size:1rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard h3 a{text-decoration:none} .vcard h3 a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.85rem;color:var(--muted)}
.vcard .watch{font-size:.88rem;font-weight:600;color:var(--accent-ink);text-decoration:none}
.vcard .watch:hover{text-decoration:underline}
.more{display:flex;justify-content:center;margin-top:26px}

.admin-row{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.empty{border:2px dashed var(--line);border-radius:12px;padding:32px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.notice{background:color-mix(in oklab,var(--gold) 18%,var(--surface));border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:.9rem;margin-top:16px}
.editbar{display:flex;gap:8px;flex-wrap:wrap}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:center}
@media (max-width:800px){.hero{grid-template-columns:1fr;gap:26px}}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,4.4vw,3rem);line-height:1.08;margin-top:8px}
.hero .lede{font-size:1.1rem;margin-top:14px;max-width:48ch}
.freeline{display:flex;align-items:center;gap:10px;margin-top:16px;font-weight:600}
.freeline .tick{width:22px;height:22px;border-radius:50%;background:var(--rail);color:#fff;display:grid;place-items:center;font-size:.8rem;flex:none}
.hero .btnrow{margin-top:22px}
.tags{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;font-size:.92rem}
.tags a,.tags span{color:var(--muted)}
.tags a{text-decoration:underline;text-underline-offset:3px}
.tags a:hover{color:var(--ink)}
.latest{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.latest .lbl{font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.82rem;color:var(--muted)}
.latest h3{font-size:1.15rem;-webkit-line-clamp:3}

.routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:44px}
@media (max-width:800px){.routes{grid-template-columns:1fr}}
.route{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;min-width:0}
.route:hover{border-color:var(--gold)}
.route{border-top:4px solid var(--gold)}
.route:hover .go{text-decoration:underline}
.route .media{aspect-ratio:16/8;max-width:100%;background:var(--maroon-deep);position:relative;overflow:hidden;display:grid;place-items:center}
.route .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.route .big{font-family:var(--display);color:var(--gold-soft);font-size:3.2rem;line-height:1;text-align:center}
.route .big small{display:block;font-family:var(--cond);font-weight:600;font-size:1rem;letter-spacing:.12em;text-transform:uppercase;margin-top:6px}
.route .rb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.route h2{font-size:1.35rem}
.route p{color:var(--muted);font-size:.95rem}
.route .go{margin-top:auto;padding-top:6px;font-weight:700;color:var(--accent-ink)}

/* Plugins */
.install{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:34px}
@media (max-width:760px){.install{grid-template-columns:1fr}}
.way{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.way h2{font-size:1.25rem}
.way ol{margin:0;padding-left:1.3em;color:var(--muted);display:grid;gap:4px}
.way ol strong{color:var(--ink)}
.way code{font-size:.85rem;background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.way .btnrow{margin-top:auto;padding-top:6px}
.way.rec{border:2px solid var(--gold)}
.rec-tag{align-self:flex-start;font-family:var(--cond);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#2a1d00;padding:2px 8px;border-radius:4px}
.plugins{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.plug{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.plug-top{display:flex;gap:12px;align-items:center}
.ico{flex:none;width:38px;height:38px;border-radius:9px;background:var(--maroon);display:grid;place-items:center;font-family:var(--display);color:var(--gold-soft);font-size:1.3rem}
.plug h3{font-family:var(--body);font-weight:700;font-size:1.02rem;line-height:1.25}
.plug .grp{font-family:var(--cond);font-size:.85rem;color:var(--muted);letter-spacing:.03em}
.plug p{color:var(--muted);font-size:.94rem}
.plug .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.key{font-family:var(--cond);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.foot-note{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted)}

/* Playlists */
.pl-group{margin-bottom:26px}
.pl-group h3.grp{font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:1rem;color:var(--muted);margin:0 0 10px}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.pl summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.pl summary::-webkit-details-marker{display:none}
.pl .stack{width:44px;height:44px;border-radius:8px;background:var(--maroon);display:grid;place-items:center;color:var(--gold-soft);font-family:var(--cond);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.pl .ptl{font-weight:700;line-height:1.3}
.pl .pd{color:var(--muted);font-size:.9rem;margin-top:2px}
.pl .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .15s}
.pl[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
.pl ol{margin:0;padding:4px 16px 8px 44px;border-top:1px solid var(--line);max-height:320px;overflow:auto}
.pl li{padding:4px 0;font-size:.95rem;color:var(--muted)}
.pl li a{color:var(--ink);text-decoration:none}
.pl li a:hover{text-decoration:underline}
.pl .pfoot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid var(--line)}

/* My Layout */
.made{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:center}
@media (max-width:760px){.made{grid-template-columns:1fr;gap:18px}}
.made-photo{margin:0;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--maroon-deep)}
.made-photo img{width:100%;height:100%;object-fit:cover;display:block}
.made-big{font-family:var(--display);font-size:clamp(2.2rem,6vw,3.2rem);line-height:1;color:var(--accent-ink);margin-top:6px}
.made h2{font-size:1.5rem;margin-top:4px}
.made p{margin-top:10px}
.made-list{list-style:none;padding:0;margin:14px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.made-list li::before{content:"\2713\00a0";color:var(--rail);font-weight:700}
@media (max-width:480px){.made-list{grid-template-columns:1fr}}
.made-not{padding:10px 14px;border-radius:8px;background:color-mix(in oklab,var(--gold) 16%,var(--surface));font-size:.95rem}
.watch-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.watch-row{grid-template-columns:1fr}}
.watch-row .vcard h3{font-size:1.15rem}
.series{display:flex;flex-direction:column;gap:8px}
.series button{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--ink);font-weight:600}
.series button:hover{border-color:var(--gold)}
.series button span{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Gallery */
.g-stage{position:relative;background:#120d0e;border-radius:12px;overflow:hidden;aspect-ratio:16/10;max-width:100%}
@media (max-width:600px){.g-stage{aspect-ratio:4/3}}
.g-main{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.g-main img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .35s ease}
.g-main img.in{opacity:1}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgb(0 0 0 / .55);color:#fff;font-size:1.9rem;line-height:1;display:grid;place-items:center;padding:0 0 4px}
.g-nav:hover{background:rgb(0 0 0 / .8)}
.g-nav.prev{left:10px}.g-nav.next{right:10px}
.g-bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;align-items:center;padding:22px 14px 10px;background:linear-gradient(transparent,rgb(0 0 0 / .75));color:#fff;font-size:.95rem;pointer-events:none}
.g-bar>*{pointer-events:auto}
#gCap{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gCount{font-variant-numeric:tabular-nums;opacity:.85}
.g-play{border:1.5px solid rgb(255 255 255 / .6);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-weight:600}
.g-thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px}
.g-th{flex:none;width:96px;height:72px;border:2px solid transparent;border-radius:6px;padding:0;overflow:hidden;background:var(--line);opacity:.7}
.g-th:hover{opacity:1}
.g-th img{width:100%;height:100%;object-fit:cover;display:block}
.g-th.on{border-color:var(--gold);opacity:1}
#gChips{margin-bottom:14px}
dialog.g-box{width:100vw;height:100vh;max-width:none;max-height:none;margin:0;background:#0b0809;padding:0;border-radius:0;box-shadow:none}
dialog.g-box::backdrop{background:#000}
.g-box img{width:100%;height:100%;object-fit:contain;display:block}
.g-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgb(255 255 255 / .15);color:#fff;font-size:1.6rem}
.g-boxcap{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:60px;right:60px;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}

/* About */
.about{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:760px){.about{grid-template-columns:1fr}}
.about .prose{display:grid;gap:14px;max-width:62ch;font-size:1.05rem}
.find{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.find h2{font-size:1.25rem}
.find .links{display:flex;flex-direction:column;gap:8px}
.find .links .btn{justify-content:center}
.for-list{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.for-list li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.92rem}

footer{border-top:1px solid var(--line);padding-block:20px 30px;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
footer nav{display:flex;flex-wrap:wrap;gap:4px 16px}

  const PAGE_HEAD = "<title>EssexBrick Model Works</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap\">\n";
  const SKEL = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  const CSS = document.getElementById("css").textContent;
  const TPL = document.getElementById("tpl").innerHTML;
  const MAIN = document.getElementById("main").textContent;
  const SC = "<" + "/script>";

  let state;
  try { state = JSON.parse(document.getElementById("state").textContent); } catch { state = {}; }
  state.site = state.site || {}; state.videos = state.videos || []; state.plugins = state.plugins || []; state.playlists = state.playlists || []; state.gallery = state.gallery || [];

  document.getElementById("app").append(document.getElementById("tpl").content.cloneNode(true));

  const CATS = {plugins:"IngeTrazo plugins", railway:"Layout & builds", modelling:"Modelling & printing"};
  const SHORT = {plugins:"Plugin", railway:"Layout", modelling:"Modelling"};
  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null) n.append(k);
    return n;
  };
  const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
  const safeImg = u => typeof u === "string" && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u) ? u : null;
  const issuesUrl = u => { const s = safeUrl(u || ""); const m = s && s.match(/^https:\/\/github\.com\/[^/]+\/[^/?#]+/); return m ? m[0] + "/issues/new" : null; };
  const fmtDate = d => { if (!d) return ""; const t = new Date(d + "T12:00:00"); return isNaN(t) ? "" : t.toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"}); };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const byNewest = (a, b) => String(b.date || "").localeCompare(String(a.date || ""));
  const cleanId = id => /^[A-Za-z0-9_-]+$/.test(String(id || "")) ? id : null;
  const ytId = u => {
    try { const x = new URL(u);
      if (/youtu\.be$/.test(x.hostname)) return cleanId(x.pathname.slice(1).split("/")[0]);
      if (x.searchParams.get("v")) return cleanId(x.searchParams.get("v"));
      const m = x.pathname.match(/\/(?:shorts|embed|live)\/([A-Za-z0-9_-]+)/); return m ? m[1] : null;
    } catch { return null; }
  };

  let artifact = null, canEdit = false, saving = false;
  let confirming = null;

  function status(msg){ const s = $("#status"); s.textContent = msg || ""; s.hidden = !msg; }

  /* ---------- Saving: the page republishes itself with the new data ---------- */
  function buildDoc(){
    const json = JSON.stringify(state).replace(/</g, "\\u003c");
    return SKEL + PAGE_HEAD + '<style id="css">' + CSS + '</style>\n<div id="app"></div>\n<template id="tpl">' + TPL +
      '</template>\n<script type="application/json" id="state">' + json + SC + '\n<script id="main">' + MAIN + SC + '</body></html>';
  }
  async function save(){
    if (!artifact) throw {message:"Saving isn't available here. Open the page in Claude while signed in."};
    saving = true; status("Saving…");
    try { await artifact.publish(buildDoc()); status("Saved. The page will refresh."); }
    catch (e) {
      saving = false;
      if (e?.code === "conflict") { status("Someone else saved at the same time. The page will refresh; please make your change again."); return; }
      status(""); throw e;
    }
  }

  /* ---------- Pages: one view at a time, chosen by the address (#plugins etc.) ---------- */
  const PAGES = ["home", "plugins", "videos", "layout", "about"];
  let page = null;
  function route(){
    const h = location.hash.slice(1);
    const next = PAGES.includes(h) ? h : "home";
    if (next === page) return;
    page = next;
    document.querySelectorAll("[data-page]").forEach(s => s.hidden = s.dataset.page !== page);
    document.querySelectorAll("[data-nav]").forEach(a => a.dataset.nav === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    window.scrollTo(0, 0);
    gRestart();
  }
  window.addEventListener("hashchange", route);

  /* ---------- All videos: the ones added by hand, plus every video in the playlists ---------- */
  function allVideos(){
    const seen = new Map();
    for (const v of state.videos){
      const id = ytId(v.url);
      const item = {key: v.id, yt: id, title: v.title, url: safeUrl(v.url), category: v.category, date: v.date, description: v.description, thumb: safeImg(v.thumb), own: v, lists: []};
      if (id) seen.set(id, item); else seen.set("own-" + v.id, item);
    }
    for (const p of state.playlists){
      const lid = cleanId(p.id); if (!lid) continue;
      (Array.isArray(p.videos) ? p.videos : []).forEach(([vid, t], i) => {
        if (!cleanId(vid)) return;
        const have = seen.get(vid);
        if (have){ have.lists.push(lid); return; }
        seen.set(vid, {key: vid, yt: vid, title: t, url: "https://www.youtube.com/watch?v=" + vid, category: p.category, date: "", lists: [lid], plTitle: p.title, plOrder: i});
      });
    }
    return [...seen.values()];
  }

  function thumbBox(v){
    const a = el("a", {class:"thumb", href:v.url || "#", target:"_blank", rel:"noopener", "aria-label":"Watch " + v.title + " on YouTube"});
    const ph = () => el("div", {class:"ph"}, el("span", {text:CATS[v.category] || "EssexBrick"}));
    const src = v.thumb || (v.yt ? "https://i.ytimg.com/vi/" + v.yt + "/mqdefault.jpg" : null);
    if (src){
      const img = el("img", {src, alt:"", loading:"lazy"});
      img.addEventListener("error", () => img.replaceWith(ph()), {once:true});
      a.append(img);
    } else a.append(ph());
    a.append(el("div", {class:"play", "aria-hidden":"true"}));
    return a;
  }

  function videoCard(v){
    const card = el("article", {class:"vcard"}, thumbBox(v),
      el("h3", {}, el("a", {href:v.url || "#", target:"_blank", rel:"noopener", text:v.title})),
      el("div", {class:"meta"},
        el("span", {class:"badge " + (v.category || ""), text:SHORT[v.category] || "Video"}),
        v.date ? el("span", {text:fmtDate(v.date)}) : v.plTitle ? el("span", {text:v.plTitle}) : null),
      v.description && v.description !== v.title ? el("p", {class:"meta", text:v.description}) : null);
    if (canEdit && v.own) card.append(adminRow("videos", v.own, () => openVideo(v.own)));
    return card;
  }
  const asItem = v => v && {key:v.id, yt:ytId(v.url), title:v.title, url:safeUrl(v.url), category:v.category, date:v.date, description:v.description, thumb:safeImg(v.thumb), own:v};

  /* ---------- Home ---------- */
  function renderHome(){
    const latest = state.videos.filter(v => v.category === "plugins").sort(byNewest)[0];
    const box = $("#homeLatest"); box.replaceChildren();
    if (latest){
      const v = asItem(latest);
      box.append(el("div", {class:"lbl", text:"Latest plugin video"}), thumbBox(v),
        el("div", {class:"side"}, el("div", {class:"vcard"}, el("h3", {}, el("a", {href:v.url || "#", target:"_blank", rel:"noopener", text:v.title})),
          el("div", {class:"meta"}, el("span", {class:"badge free", text:"Free plugin"}), v.date ? el("span", {text:fmtDate(v.date)}) : null)),
          el("div", {}, el("a", {class:"btn", href:v.url || "#", target:"_blank", rel:"noopener", text:"Watch on YouTube"}))));
    } else box.append(el("div", {class:"empty"}, el("strong", {text:"New plugin video coming soon"})));
    $("#rPlugCount").textContent = state.plugins.length; $("#ctaCount").textContent = state.plugins.length;
    $("#rVidCount").textContent = allVideos().length;
  }

  /* ---------- Videos page ---------- */
  let vFilter = "all", vList = "", query = "", vShown = 24;
  function renderVideoControls(){
    const all = allVideos();
    const counts = {all: all.length}; for (const k in CATS) counts[k] = all.filter(v => v.category === k).length;
    $("#vChips").replaceChildren(...[["all", "All"], ...Object.entries(CATS)].filter(([k]) => k === "all" || counts[k]).map(([k, label]) =>
      el("button", {class:"chip", type:"button", "aria-pressed":String(k === vFilter), onclick: () => { vFilter = k; vList = ""; vShown = 24; renderVideoControls(); renderVideos(); }},
        label, el("span", {class:"n", text:String(counts[k])}))));
    const pick = $("#plPick");
    const lists = state.playlists.filter(p => cleanId(p.id) && (vFilter === "all" || p.category === vFilter));
    pick.replaceChildren(el("option", {value:"", text:"All playlists"}), ...lists.map(p => el("option", {value:p.id, text:p.title})));
    pick.value = lists.some(p => p.id === vList) ? vList : "";
  }
  function renderVideos(){
    const grid = $("#videoGrid"); grid.replaceChildren();
    const q = query.trim().toLowerCase();
    let list = allVideos().filter(v => (vFilter === "all" || v.category === vFilter) && (!vList || v.lists.includes(vList)) &&
      (!q || (v.title + " " + (v.description || "") + " " + (v.plTitle || "")).toLowerCase().includes(q)));
    if (vList){
      const p = state.playlists.find(x => x.id === vList);
      const order = new Map((p?.videos || []).map(([id], i) => [id, i]));
      list.sort((a, b) => (order.get(a.yt) ?? 999) - (order.get(b.yt) ?? 999));
    } else list.sort((a, b) => byNewest(a, b));
    $("#vCount").textContent = list.length === 1 ? "1 video" : list.length + " videos";
    if (!list.length){
      grid.append(el("div", {class:"empty", style:"grid-column:1/-1"}, el("strong", {text:"No videos match"}), "Try another subject or clear the search."));
      $("#moreBox").hidden = true; return;
    }
    for (const v of list.slice(0, vShown)) grid.append(videoCard(v));
    $("#moreBox").hidden = list.length <= vShown;
    $("#moreBtn").textContent = "Show more (" + (list.length - vShown) + " left)";
  }
  $("#moreBtn").addEventListener("click", () => { vShown += 24; renderVideos(); });
  $("#plPick").addEventListener("change", e => { vList = e.target.value; vShown = 24; renderVideos(); });
  $("#q").addEventListener("input", e => { query = e.target.value; vShown = 24; renderVideos(); });
  function showPlaylist(id){
    const p = state.playlists.find(x => x.id === id);
    vFilter = p?.category || "all"; vList = id; query = ""; $("#q").value = ""; vShown = 24;
    renderVideoControls(); renderVideos(); location.hash = "videos";
  }

  function adminRow(coll, item, onEdit){
    const key = coll + "/" + item.id;
    if (confirming === key){
      return el("div", {class:"admin-row confirm"}, "Remove this for good?",
        el("button", {class:"btn small danger", type:"button", text:"Remove", onclick: () => removeItem(coll, item)}),
        el("button", {class:"btn small ghost", type:"button", text:"Keep", onclick: () => { confirming = null; renderAll(); }}));
    }
    return el("div", {class:"admin-row"},
      el("button", {class:"btn small ghost", type:"button", text:"Edit", onclick:onEdit}),
      el("button", {class:"btn small ghost", type:"button", text:"Remove", onclick: () => { confirming = key; renderAll(); }}));
  }
  async function removeItem(coll, item){
    if (saving) return;
    confirming = null;
    const before = state[coll];
    state[coll] = before.filter(x => x.id !== item.id);
    try { await save(); } catch (e) { state[coll] = before; status("Couldn't remove that: " + (e.message || e.code)); }
    renderAll();
  }

  /* ---------- Plugins ---------- */
  const PGROUPS = [["build","Building the model"],["detail","Shaping & detailing"],["print","Scaling & printing"],["helpers","Workspace helpers"],["other","More plugins"]];
  let pFilter = "all";
  function renderPlugins(){
    const grid = $("#pluginGrid"); grid.replaceChildren();
    const n = state.plugins.length;
    $("#plugCount").textContent = n || "";
    const site = state.site, gh = safeUrl(site.github), it = safeUrl(site.ingetrazo), tour = safeUrl(site.tour || ""), guides = safeUrl(site.guides || "");
    $("#getIT").replaceChildren(...[it ? el("a", {class:"btn", href:it, target:"_blank", rel:"noopener", text:"Open IngeTrazo extensions"}) : null,
      tour ? el("a", {class:"btn ghost", href:tour, target:"_blank", rel:"noopener", text:"Watch the install video"}) : null].filter(Boolean));
    $("#getGH").replaceChildren(...[gh ? el("a", {class:"btn", href:gh, target:"_blank", rel:"noopener", text:"Download from GitHub"}) : null,
      guides ? el("a", {class:"btn ghost", href:guides, target:"_blank", rel:"noopener", text:"User guides"}) : null].filter(Boolean));
    if (!n){
      $("#pChips").replaceChildren();
      grid.append(el("div", {class:"empty", style:"grid-column:1/-1"}, el("strong", {text: canEdit ? "No plugins listed yet" : "Plugins coming soon"})));
      return;
    }
    const gOf = p => PGROUPS.some(g => g[0] === p.group) ? p.group : "other";
    const label = Object.fromEntries(PGROUPS);
    const used = PGROUPS.filter(([g]) => state.plugins.some(p => gOf(p) === g));
    const nNew = state.plugins.filter(p => p.isNew).length;
    if (!(pFilter === "all" || (pFilter === "new" && nNew) || used.some(g => g[0] === pFilter))) pFilter = "all";
    const chipDefs = [...(nNew ? [["new", "New"]] : []), ["all", "All"], ...used];
    $("#pChips").replaceChildren(...chipDefs.map(([g, l]) => el("button", {class:"chip" + (g === "new" ? " chip-new" : ""), type:"button", "aria-pressed":String(g === pFilter),
      onclick: () => { pFilter = g; renderPlugins(); }}, l, el("span", {class:"n", text:String(g === "all" ? n : g === "new" ? nNew : state.plugins.filter(p => gOf(p) === g).length)}))));
    const sortIn = list => [...list].sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(String(b.name)));
    const card = p => {
      const pg = safeUrl(p.github || ""), vid = safeUrl(p.video), pic = picSafe(p.pic);
      const c = el("article", {class:"plug"},
        pic ? el("button", {class:"plug-pic", type:"button", "aria-label":"See " + p.name + " pictures full size", onclick: () => openPic(pic, p.name)},
          el("img", {src:pic.replace(/\.(webp|jpg|png)$/, "-sm.$1"), alt:p.name + " examples", loading:"lazy"}),
          p.isNew ? el("span", {class:"new-tag", text:"New"}) : null) : null,
        el("div", {class:"plug-top"}, el("div", {class:"ico", "aria-hidden":"true", text:"E"}),
          el("div", {}, el("h3", {}, p.name, !pic && p.isNew ? el("span", {class:"new-tag inline", text:"New"}) : null),
            el("div", {class:"grp", text:label[gOf(p)]}), p.shortcut ? el("div", {class:"key", text:p.shortcut}) : null)),
        p.description ? el("p", {text:p.description}) : null,
        (vid || pg) ? el("div", {class:"links"},
          vid ? el("a", {class:"btn small", href:vid, target:"_blank", rel:"noopener", text:"▶ Watch tutorial"}) : null,
          pg ? el("a", {class:"btn small ghost", href:pg, target:"_blank", rel:"noopener", text:"User guide"}) : null) : null);
      if (canEdit) c.append(adminRow("plugins", p, () => openPlugin(p)));
      return c;
    };
    const section = (title, list) => el("div", {class:"pgroup"},
      el("h2", {class:"grp-h"}, title, el("span", {class:"n", text:String(list.length)})),
      el("div", {class:"plugins"}, list.map(card)));
    if (pFilter === "new") grid.append(section("New plugins", sortIn(state.plugins.filter(p => p.isNew))));
    else for (const [g, l] of used){
      if (pFilter !== "all" && pFilter !== g) continue;
      grid.append(section(l, sortIn(state.plugins.filter(p => gOf(p) === g))));
    }
  }

  /* ---------- Plugin pictures: click to see full size ---------- */
  const picSafe = f => typeof f === "string" && /^plugins\/[a-z0-9-]+\.(webp|jpg|png)$/.test(f) ? f : null;
  function openPic(src, name){ $("#picImg").src = src; $("#picImg").alt = name + " examples"; $("#picCap").textContent = name; $("#picBox").showModal(); }
  $("#picClose").addEventListener("click", () => $("#picBox").close());
  $("#picBox").addEventListener("click", e => { if (e.target === e.currentTarget || e.target.id === "picImg") $("#picBox").close(); });

  /* ---------- My Layout ---------- */
  function renderLayout(){
    const layout = state.videos.find(v => v.featured);
    const box = $("#slotLayout"); box.replaceChildren();
    if (layout) box.append(videoCard(asItem(layout)));
    else box.append(el("div", {class:"empty"}, el("strong", {text: canEdit ? "Nothing here yet" : "Coming soon"}), canEdit ? "Add your layout video and tick “Show as My layout video”." : "A tour of the layout is on its way."));
    const rail = state.playlists.filter(p => p.category === "railway" && cleanId(p.id) && (p.videos || []).length);
    $("#railSeries").replaceChildren(el("div", {class:"eyebrow", text:"More from the layout"}), ...rail.map(p =>
      el("button", {type:"button", onclick: () => showPlaylist(p.id)}, p.title, el("span", {text:(p.videos.length === 1 ? "1 video" : p.videos.length + " videos") + " →"}))));
  }

  /* ---------- Site ---------- */
  function renderSite(){
    const site = state.site;
    if (site.tagline) $("#tagline").textContent = site.tagline;
    if (site.intro) $("#intro").textContent = site.intro;
    { const r = issuesUrl(site.github); if (r) $("#reportBtn").href = r; }
    const tb = $("#logoTags"); tb.replaceChildren();
    for (const t of (Array.isArray(site.logoTags) ? site.logoTags : [])){
      const [txt, link] = String(t).split("|").map(s => s.trim());
      if (!txt) continue;
      const u = safeUrl(link || "");
      tb.append(u ? el("a", {class:"logo-tag", href:u, target:"_blank", rel:"noopener", text:txt}) : el("span", {class:"logo-tag", text:txt}));
    }
    const box = $("#siteLinks"); box.replaceChildren();
    const items = [["youtube","YouTube channel",true],["facebook","Facebook page"],["github","GitHub"],["ingetrazo","IngeTrazo extensions"]];
    let any = false;
    for (const [k, label, primary] of items){
      const u = safeUrl(site[k]); if (!u) continue; any = true;
      box.append(el("a", {class:"btn" + (primary ? "" : " ghost"), href:u, target:"_blank", rel:"noopener", text:label}));
    }
    if (!any) box.append(el("span", {class:"sub", text: canEdit ? "Add your channel and GitHub links with the button below." : "Links coming soon."}));
  }

  function renderAll(){
    document.querySelectorAll("[data-edit]").forEach(n => n.hidden = !canEdit);
    renderHome(); renderVideoControls(); renderVideos(); renderPlugins(); renderSite(); renderPlaylists(); renderLayout(); renderGallery();
  }

  /* ---------- Thumbnails: shrink to 640×360 and keep inside the page ---------- */
  function shrinkImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const W = 640, H = 360, c = document.createElement("canvas"); c.width = W; c.height = H;
        const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
        c.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.78));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject({message:"That file isn't an image I can read."}); };
      img.src = url;
    });
  }

  /* ---------- Dialogs ---------- */
  let editingVideo = null, pendingThumb = null, editingPlugin = null;
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));

  function openVideo(v){
    editingVideo = v || null; pendingThumb = null;
    $("#dvTitle").textContent = v ? "Edit video" : "Add video";
    $("#v-title").value = v?.title || ""; $("#v-url").value = v?.url || "";
    $("#v-cat").value = v?.category || (vFilter !== "all" ? vFilter : "plugins");
    $("#v-date").value = v?.date || new Date().toISOString().slice(0,10);
    $("#v-desc").value = v?.description || ""; $("#v-feat").checked = !!v?.featured;
    $("#v-thumb").value = ""; $("#v-err").textContent = "";
    const pv = $("#v-thumbprev"), img = safeImg(v?.thumb);
    if (img){ pv.src = img; pv.hidden = false; } else { pv.hidden = true; pv.removeAttribute("src"); }
    $("#dlgVideo").showModal();
  }
  $("#v-thumb").addEventListener("change", async e => {
    const f = e.target.files[0]; pendingThumb = null; if (!f) return;
    try { pendingThumb = await shrinkImage(f); const pv = $("#v-thumbprev"); pv.src = pendingThumb; pv.hidden = false; $("#v-err").textContent = ""; }
    catch (err){ $("#v-err").textContent = err.message; }
  });
  $("#fVideo").addEventListener("submit", async e => {
    e.preventDefault(); if (saving) return;
    const url = safeUrl($("#v-url").value.trim());
    if (!url){ $("#v-err").textContent = "Paste the full YouTube link, starting with https://"; return; }
    const btn = $("#v-save"); btn.disabled = true; btn.textContent = "Saving…";
    const before = state.videos;
    const item = {id: editingVideo?.id || newId(), title:$("#v-title").value.trim(), url, category:$("#v-cat").value, date:$("#v-date").value,
      description:$("#v-desc").value.trim(), featured:$("#v-feat").checked, thumb: pendingThumb || editingVideo?.thumb || null};
    let list = before.map(x => item.featured && x.featured ? {...x, featured:false} : x);
    list = editingVideo ? list.map(x => x.id === item.id ? item : x) : [...list, item];
    state.videos = list;
    try { await save(); $("#dlgVideo").close(); }
    catch (err){ state.videos = before; $("#v-err").textContent = "Couldn't save: " + (err?.message || err?.code || err); }
    finally { btn.disabled = false; btn.textContent = "Save video"; renderAll(); }
  });

  function openPlugin(p){
    editingPlugin = p || null;
    $("#dpTitle").textContent = p ? "Edit plugin" : "Add plugin";
    $("#p-name").value = p?.name || ""; $("#p-desc").value = p?.description || "";
    $("#p-gh").value = p?.github || ""; $("#p-group").value = p?.group || "build"; $("#p-key").value = p?.shortcut || ""; $("#p-vid").value = p?.video || ""; $("#p-new").checked = !!p?.isNew; $("#p-err").textContent = "";
    $("#dlgPlugin").showModal();
  }
  $("#fPlugin").addEventListener("submit", async e => {
    e.preventDefault(); if (saving) return;
    const before = state.plugins;
    const item = {id: editingPlugin?.id || newId(), name:$("#p-name").value.trim(), description:$("#p-desc").value.trim(),
      github:$("#p-gh").value.trim(), video:$("#p-vid").value.trim(), group:$("#p-group").value, shortcut:$("#p-key").value.trim(), order: editingPlugin?.order ?? before.length + 1, pic: editingPlugin?.pic || null, isNew: $("#p-new").checked};
    state.plugins = editingPlugin ? before.map(x => x.id === item.id ? item : x) : [...before, item];
    try { await save(); $("#dlgPlugin").close(); }
    catch (err){ state.plugins = before; $("#p-err").textContent = "Couldn't save: " + (err?.message || err?.code); }
    renderAll();
  });

  $("#editSite").addEventListener("click", () => {
    const site = state.site;
    $("#s-tag").value = site.tagline || $("#tagline").textContent; $("#s-intro").value = site.intro || $("#intro").textContent;
    $("#s-tags").value = (site.logoTags || []).join("\n");
    $("#s-yt").value = site.youtube || ""; $("#s-gh").value = site.github || "";
    $("#s-it").value = site.ingetrazo || ""; $("#s-fb").value = site.facebook || ""; $("#s-err").textContent = "";
    $("#dlgSite").showModal();
  });
  $("#fSite").addEventListener("submit", async e => {
    e.preventDefault(); if (saving) return;
    const before = state.site;
    state.site = {tagline:$("#s-tag").value.trim(), intro:$("#s-intro").value.trim(),
      logoTags:$("#s-tags").value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 8), youtube:$("#s-yt").value.trim(),
      github:$("#s-gh").value.trim(), ingetrazo:$("#s-it").value.trim(), facebook:$("#s-fb").value.trim(), tour:before.tour, guides:before.guides};
    try { await save(); $("#dlgSite").close(); }
    catch (err){ state.site = before; $("#s-err").textContent = "Couldn't save: " + (err?.message || err?.code); }
    renderAll();
  });
  $("#addVideo").addEventListener("click", () => openVideo(null));
  $("#addPlugin").addEventListener("click", () => openPlugin(null));

  /* ---------- Playlists ---------- */
  const plId = u => { try { return new URL(u).searchParams.get("list"); } catch { return null; } };
  function renderPlaylists(){
    const wrap = $("#plWrap"); wrap.replaceChildren();
    const all = state.playlists || [];
    if (!all.length){ wrap.append(el("div", {class:"empty"}, el("strong", {text:"Playlists coming soon"}))); return; }
    for (const [cat, label] of Object.entries(CATS)){
      const list = all.filter(p => p.category === cat);
      if (!list.length) continue;
      const grid = el("div", {class:"pl-grid"});
      for (const p of list){
        const lid = cleanId(p.id); if (!lid) continue;
        const vids = Array.isArray(p.videos) ? p.videos : [];
        const playAll = "https://www.youtube.com/playlist?list=" + lid;
        grid.append(el("details", {class:"pl"},
          el("summary", {},
            el("div", {class:"stack", "aria-hidden":"true", text: vids.length ? String(vids.length) : "▶"}),
            el("div", {}, el("div", {class:"ptl", text:p.title}),
              el("div", {class:"pd", text: (vids.length ? vids.length + (vids.length === 1 ? " video" : " videos") : "Playlist") + (p.description ? " · " + p.description : "")})),
            el("span", {class:"chev", "aria-hidden":"true"})),
          vids.length ? el("ol", {}, vids.map(([vid, t]) => cleanId(vid) ? el("li", {}, el("a", {href:"https://www.youtube.com/watch?v=" + vid + "&list=" + lid, target:"_blank", rel:"noopener", text:t})) : null)) : null,
          el("div", {class:"pfoot"},
            vids.length ? el("button", {class:"btn small ghost", type:"button", text:"Show with pictures", onclick: () => { showPlaylist(lid); window.scrollTo(0, 0); }}) : null,
            el("a", {class:"btn small", href:playAll, target:"_blank", rel:"noopener", text:"Play all on YouTube"}),
            canEdit ? adminRow("playlists", p, () => openPlaylist(p)) : null)));
      }
      wrap.append(el("div", {class:"pl-group"}, el("h3", {class:"grp", text:label}), grid));
    }
  }
  let editingPlaylist = null;
  function openPlaylist(p){
    editingPlaylist = p || null;
    $("#dlTitle").textContent = p ? "Edit playlist" : "Add playlist";
    $("#l-title").value = p?.title || ""; $("#l-url").value = p ? "https://www.youtube.com/playlist?list=" + p.id : "";
    $("#l-cat").value = p?.category || "plugins"; $("#l-desc").value = p?.description || ""; $("#l-err").textContent = "";
    $("#dlgPlaylist").showModal();
  }
  $("#fPlaylist").addEventListener("submit", async e => {
    e.preventDefault(); if (saving) return;
    const id = cleanId(plId($("#l-url").value.trim()));
    if (!id){ $("#l-err").textContent = "Paste the playlist link. It has list= in it."; return; }
    const before = state.playlists || [];
    const keep = editingPlaylist && editingPlaylist.id === id ? editingPlaylist.videos : [];
    const item = {id, title:$("#l-title").value.trim(), category:$("#l-cat").value, description:$("#l-desc").value.trim(), videos: keep || []};
    state.playlists = editingPlaylist ? before.map(x => x.id === editingPlaylist.id ? item : x) : [...before, item];
    try { await save(); $("#dlgPlaylist").close(); }
    catch (err){ state.playlists = before; $("#l-err").textContent = "Couldn't save: " + (err?.message || err?.code); }
    renderAll();
  });
  $("#addPlaylist").addEventListener("click", () => openPlaylist(null));

  /* ---------- Gallery: category buttons, shuffled slideshow, thumbnails, full screen ---------- */
  const gSafe = f => typeof f === "string" && /^gallery\/[a-z0-9-]+\.(jpg|jpeg|png|webp)$/.test(f) ? f : null;
  const G = {cat:"All", order:[], i:0, timer:null, playing: !matchMedia("(prefers-reduced-motion: reduce)").matches};
  const gAll = () => (state.gallery || []).filter(x => gSafe(x.f));
  function gShuffle(a){ a = [...a]; for (let k = a.length - 1; k > 0; k--){ const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
  function gStart(){ const l = gAll().filter(x => G.cat === "All" || x.c === G.cat); G.order = gShuffle(l); G.i = 0; const k = G.order.findIndex(x => x.c === "Overall view"); if (G.cat === "All" && k > 0) [G.order[0], G.order[k]] = [G.order[k], G.order[0]]; }
  function gChips(){
    const all = gAll(), cats = ["All", ...new Set(all.map(x => x.c))];
    $("#gChips").replaceChildren(...cats.map(c => el("button", {class:"chip", type:"button", "aria-pressed":String(c === G.cat),
      onclick: () => { G.cat = c; gStart(); gChips(); gThumbs(); gShow(); gRestart(); }},
      c, el("span", {class:"n", text:String(c === "All" ? all.length : all.filter(x => x.c === c).length)}))));
  }
  function gThumbs(){
    $("#gThumbs").replaceChildren(...G.order.map((x, k) => el("button", {class:"g-th", type:"button", "aria-label":"Show " + x.t,
      onclick: () => { G.i = k; gShow(); gRestart(); }}, el("img", {src:x.f, alt:"", loading:"lazy"}))));
  }
  function gShow(){
    const x = G.order[G.i]; if (!x) return;
    const img = $("#gImg");
    if (img.getAttribute("src") !== x.f){ img.classList.remove("in"); img.onload = () => img.classList.add("in"); img.src = x.f; }
    img.alt = x.t; $("#gCap").textContent = x.t; $("#gCount").textContent = (G.i + 1) + " / " + G.order.length;
    const box = $("#gThumbs");
    [...box.children].forEach((b, k) => b.classList.toggle("on", k === G.i));
    const th = box.children[G.i];
    if (th && page === "layout") box.scrollTo({left: th.offsetLeft - box.offsetLeft - box.clientWidth / 2 + th.clientWidth / 2, behavior:"smooth"});
    const nx = G.order[(G.i + 1) % G.order.length]; if (nx && page === "layout") new Image().src = nx.f;
    if ($("#gBox").open){ $("#gBoxImg").src = x.f; $("#gBoxImg").alt = x.t; $("#gBoxCap").textContent = x.t + "  (" + (G.i + 1) + " / " + G.order.length + ")"; }
  }
  function gStep(d){ if (!G.order.length) return; G.i = (G.i + d + G.order.length) % G.order.length; gShow(); }
  function gRestart(){
    clearInterval(G.timer);
    if (G.playing && page === "layout" && !$("#gBox").open) G.timer = setInterval(() => { if (!document.hidden) gStep(1); }, 5000);
    $("#gPlay").textContent = G.playing ? "Pause" : "Play";
  }
  function renderGallery(){
    const all = gAll(); $("#gallery").hidden = !all.length; if (!all.length) return;
    if (!G.order.length) gStart();
    gChips(); gThumbs(); gShow(); gRestart();
  }
  $("#gPrev").addEventListener("click", () => { gStep(-1); gRestart(); });
  $("#gNext").addEventListener("click", () => { gStep(1); gRestart(); });
  $("#gPlay").addEventListener("click", () => { G.playing = !G.playing; gRestart(); });
  $("#gMain").addEventListener("click", () => { $("#gBox").showModal(); gShow(); gRestart(); });
  $("#gBoxPrev").addEventListener("click", () => gStep(-1));
  $("#gBoxNext").addEventListener("click", () => gStep(1));
  $("#gBoxClose").addEventListener("click", () => $("#gBox").close());
  $("#gBox").addEventListener("close", gRestart);
  $("#gBox").addEventListener("click", e => { if (e.target === e.currentTarget) $("#gBox").close(); });
  document.addEventListener("keydown", e => {
    const inBox = $("#gBox").open, inGal = $("#gallery").contains(document.activeElement);
    if (!inBox && !inGal) return;
    if (e.key === "ArrowLeft"){ gStep(-1); if (!inBox) gRestart(); }
    if (e.key === "ArrowRight"){ gStep(1); if (!inBox) gRestart(); }
  });

  route();
  renderAll();

  /* ---------- Editing controls appear only for Eddy ---------- */
  (async () => {
    if (!window.claude?.use) return;
    const [a, u] = await Promise.all([claude.use("artifact"), claude.use("user")]);
    artifact = a;
    try { canEdit = !!(a && u && await u.isOwner()); } catch { canEdit = false; }
    if (canEdit) renderAll();
  })();
})();
</script>
</body></html>
