<style id="css">/* Layout: works-plate masthead, then a filterable video yard, the plugin shelf, and a links band. */
:root{
  --bg:#F2F0EE; --surface:#FFFFFF; --ink:#1F1A1B; --muted:#6B6163; --line:#DCD6D4;
  --maroon:#6E1E28; --maroon-deep:#4C121A; --gold:#C79A2E; --gold-soft:#E6C670; --on-maroon:#F6E7C1;
  --rail:#3E6B57; --plug:#2F5F8A; --model:#8A5A2B;
  --display:"Alfa Slab One", "Rockwell", Georgia, serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171213; --surface:#221B1C; --ink:#F1E9E6; --muted:#B0A3A2; --line:#3A3031;
  --maroon:#7E2632; --maroon-deep:#3A0E14; --gold:#D9AE45; --gold-soft:#E8CC80; --on-maroon:#F6E7C1;
  --rail:#7FB89C; --plug:#7FB0DD; --model:#D49C62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171213; --surface:#221B1C; --ink:#F1E9E6; --muted:#B0A3A2; --line:#3A3031;
  --maroon:#7E2632; --maroon-deep:#3A0E14; --gold:#D9AE45; --gold-soft:#E8CC80; --on-maroon:#F6E7C1;
  --rail:#7FB89C; --plug:#7FB0DD; --model:#D49C62; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Masthead */
.mast{background:var(--maroon-deep);color:var(--on-maroon);position:relative;overflow:hidden}
.mast::before{content:"";position:absolute;inset:0;opacity:.13;
  background-image:linear-gradient(90deg,transparent 47%,var(--gold) 47%,var(--gold) 53%,transparent 53%),
  linear-gradient(0deg,transparent 47%,var(--gold) 47%,var(--gold) 53%,transparent 53%);
  background-size:64px 22px,32px 22px;background-position:0 0,0 0}
.mast .wrap{position:relative;padding-block:28px 34px;display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:start}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;width:max-content;min-width:300px;max-width:100%}
.logo-tags{display:flex;flex-direction:column;align-items:stretch;gap:8px;width:100%}
.logo-tag{font-family:var(--cond);font-weight:600;font-size:.98rem;letter-spacing:.03em;text-align:center;color:var(--on-maroon);
  background:color-mix(in oklab,var(--maroon) 80%,transparent);border:1.5px solid var(--gold);border-radius:999px;padding:6px 14px;text-decoration:none;display:block}
.logo-tag b{color:var(--gold-soft);font-weight:700}
a.logo-tag::after{content:"\00a0\1F446"}
.logo-tag{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a,button,.chip{cursor:pointer}
.btn{white-space:nowrap}
a.logo-tag:hover{background:var(--gold);color:var(--maroon-deep)}
a.logo-tag:hover::after{color:inherit}
a.logo-tag:hover b{color:inherit}
.mast .copy{padding-top:14px}
.plate{width:300px;max-width:100%;aspect-ratio:2/1.15;border-radius:50%;background:var(--maroon);
  border:6px solid var(--gold);box-shadow:inset 0 0 0 3px var(--maroon),inset 0 0 0 5px var(--gold-soft),0 8px 24px rgb(0 0 0 / .35);
  display:grid;place-items:center;text-align:center;padding:14px}
.plate .t1{font-family:var(--display);color:var(--gold-soft);font-size:2.05rem;line-height:1;letter-spacing:.02em}
.plate .t2{font-family:var(--cond);font-weight:700;color:var(--gold-soft);letter-spacing:.2em;font-size:.95rem;text-transform:uppercase}
.plate .t0{font-family:var(--display);color:var(--gold-soft);font-size:1.25rem;letter-spacing:.03em;line-height:1}
.plate .rule{height:2px;width:70%;background:var(--gold);margin:8px auto}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.05;color:var(--on-maroon)}
.mast .tag{font-family:var(--cond);font-size:1.35rem;font-weight:500;color:var(--gold-soft);margin-top:10px;letter-spacing:.02em}
.mast p.lede{max-width:56ch;margin:14px 0 0;color:color-mix(in oklab,var(--on-maroon) 85%,transparent)}
.mast nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.mast nav a{font-family:var(--cond);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.95rem;text-decoration:none;
  padding:7px 14px;border:1.5px solid var(--gold);border-radius:999px;color:var(--gold-soft)}
.mast nav a:hover{background:var(--gold);color:var(--maroon-deep)}
@media (max-width:720px){.mast .wrap{grid-template-columns:1fr;gap:22px}.brand{min-width:0;margin:0 auto}.plate{width:240px}.plate .t1{font-size:1.6rem}.mast .copy{padding-top:0}}

/* Sections */
section{padding-block:44px 8px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.eyebrow{font-family:var(--cond);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:.85rem;color:var(--maroon)}
:root[data-theme="dark"] .eyebrow{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .eyebrow{color:var(--gold)}}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,3vw,2.1rem);line-height:1.1}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}

.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;
  background:var(--maroon);color:var(--on-maroon);text-decoration:none}
.btn:hover{background:var(--maroon-deep)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted)}
.btn.small{padding:5px 10px;font-size:.88rem;border-radius:6px}
.btn.danger{background:#A3262F;color:#fff}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;
  font-family:var(--cond);font-weight:600;font-size:1rem;letter-spacing:.03em;display:inline-flex;gap:8px;align-items:center}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.7}
.search{flex:1 1 220px;max-width:320px;margin-left:auto;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.featured{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:720px){.card.featured{grid-template-columns:1fr}}
.thumb{aspect-ratio:16/9;max-width:100%;background:var(--maroon-deep);position:relative;display:block;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center}
.thumb .ph span{border:3px solid var(--gold);border-radius:50%;padding:12px 26px;font-family:var(--display);color:var(--gold-soft);font-size:1.15rem;background:var(--maroon);text-align:center;line-height:1.1}
.thumb .play{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:rgb(0 0 0 / .6);display:grid;place-items:center}
.thumb .play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.featured .body{padding:22px 24px;justify-content:center}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.badge{font-family:var(--cond);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;padding:2px 8px;border-radius:4px;color:var(--surface)}
.badge.railway{background:var(--rail)} .badge.plugins{background:var(--plug)} .badge.modelling{background:var(--model)}
.badge.star{background:var(--gold);color:#2a1d00}
.card h3{font-family:var(--body);font-weight:700;font-size:1.08rem;line-height:1.3}
.featured h3{font-family:var(--display);font-weight:400;font-size:1.6rem}
.card h3 a{text-decoration:none} .card h3 a:hover{text-decoration:underline}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.admin-row{display:flex;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

.empty{border:2px dashed var(--line);border-radius:12px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}

/* Showcase: layout + latest plugin video */
.showcase{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.showcase{grid-template-columns:1fr}}
.slot{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot-label{font-family:var(--cond);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.9rem;color:var(--muted)}
.slot .card{flex:1}
.slot .card h3{font-family:var(--display);font-weight:400;font-size:1.35rem}

/* Free messaging */
.freebar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.stamp{font-family:var(--display);font-size:1.05rem;color:var(--maroon-deep);background:var(--gold);padding:6px 14px;border-radius:6px;transform:rotate(-2deg);display:inline-block;box-shadow:0 3px 0 var(--gold-soft)}
.freebar .small-note{font-family:var(--cond);font-size:1.05rem;color:var(--gold-soft);letter-spacing:.02em}
.badge.free{background:var(--gold);color:#2a1d00}
.free-strip{margin-top:18px;background:var(--surface);border:2px solid var(--gold);border-radius:10px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.free-strip strong{font-family:var(--display);font-weight:400;font-size:1.2rem}
.free-strip ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.95rem}
.free-strip li::before{content:"✓ ";color:var(--rail);font-weight:700}

/* Plugins */
.plugins{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.plug{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plug-top{display:flex;gap:14px;align-items:center}
.ico{flex:none;width:48px;height:48px;border-radius:10px;background:var(--maroon);display:grid;place-items:center;
  font-family:var(--display);color:var(--gold-soft);font-size:1.5rem;border:2px solid var(--gold)}
.plug h3{font-family:var(--body);font-weight:700;font-size:1.12rem}
.ready{font-family:var(--cond);font-weight:700;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--rail);border:1.5px solid currentColor;border-radius:4px;padding:1px 6px;display:inline-block;margin-top:2px}
.plug p{margin:0;color:var(--muted)}
.plug .links{display:flex;flex-wrap:wrap;gap:8px}
.free{font-weight:700;color:var(--ink)}


/* Playlists */
.pl-group{margin-bottom:26px}
.pl-group h3.grp{font-family:var(--cond);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:1rem;color:var(--muted);margin:0 0 10px}
.pl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;align-items:start}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.pl summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
.pl summary::-webkit-details-marker{display:none}
.pl .stack{width:46px;height:46px;border-radius:8px;background:var(--maroon);border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold-soft);font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.pl .pt{font-weight:700;line-height:1.3}
.pl .pd{color:var(--muted);font-size:.9rem;margin-top:2px}
.pl .chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;transition:transform .15s}
.pl[open] .chev{transform:rotate(-135deg);margin-bottom:-4px}
.pl ol{margin:0;padding:4px 16px 8px 46px;border-top:1px solid var(--line);max-height:340px;overflow:auto}
.pl li{padding:5px 0;font-size:.95rem;color:var(--muted)}
.pl li a{color:var(--ink);text-decoration:none}
.pl li a:hover{text-decoration:underline;color:var(--maroon)}
.pl .pfoot{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line)}

/* Links band */
.band{margin-top:48px;background:var(--maroon);color:var(--on-maroon)}
.band .wrap{padding-block:34px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
@media (max-width:720px){.band .wrap{grid-template-columns:1fr}}
.band h2{color:var(--on-maroon)}
.band .sub{color:color-mix(in oklab,var(--on-maroon) 80%,transparent)}
.band .links{display:flex;flex-wrap:wrap;gap:10px}
.band .btn{background:var(--gold);color:#2a1d00}
.band .btn:hover{background:var(--gold-soft)}
.band .btn.ghost{background:transparent;color:var(--on-maroon);border-color:color-mix(in oklab,var(--on-maroon) 40%,transparent)}
footer{padding-block:22px 34px;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

.notice{background:color-mix(in oklab,var(--gold) 18%,var(--surface));border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:.9rem;margin-bottom:16px}
.editbar{display:flex;gap:8px;flex-wrap:wrap}

/* Dialog */
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));box-shadow:0 20px 60px rgb(0 0 0 / .35)}
dialog::backdrop{background:rgb(20 10 12 / .55)}
.dlg-h{background:var(--maroon);color:var(--on-maroon);padding:14px 20px;font-family:var(--display);font-size:1.2rem}
form.f{padding:18px 20px 20px;display:grid;gap:12px}
.f label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
.f input[type=text],.f input[type=url],.f input[type=date],.f select,.f textarea{width:100%;padding:8px 10px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font-weight:400}
.f textarea{min-height:80px;resize:vertical}
.f .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.f .row{grid-template-columns:1fr}}
.f .hint{font-weight:400;color:var(--muted);font-size:.82rem}
.f .chk{display:flex;gap:8px;align-items:center;font-weight:500}
.f .act{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.f .err{color:#B3262F;font-size:.9rem;min-height:1em}
.thumbprev{max-width:160px;border-radius:6px;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.card,.plug{transition:transform .15s ease,box-shadow .15s ease}.card:hover,.plug:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgb(0 0 0 / .08)}}</style>
<div id="app"></div>
<template id="tpl"><header class="mast">
  <div class="wrap">
    <div class="brand">
      <div class="plate" aria-hidden="true"><div><div class="t0">EssexBrick</div><div class="rule"></div><div class="t1">MODEL<br>WORKS</div><div class="rule"></div></div></div>
      <div class="logo-tags" id="logoTags"><a class="logo-tag" href="https://ingetrazo.com/en/" target="_blank" rel="noopener">Built for IngeTrazo, the free CAD software</a><a class="logo-tag" href="https://www.youtube.com/@EssexBrick" target="_blank" rel="noopener">Watch on YouTube: @EssexBrick</a></div>
    </div>
    <div class="copy">
      <h1>EssexBrick Model Works</h1>
      <div class="tag" id="tagline">Build in the real world, print in the scale world.</div>
      <p class="lede" id="intro">For modellers who build in the real world and print in the scale world. Measure it, scale it, print it, in any scale.</p>
      <div class="freebar"><span class="stamp">100% FREE</span><span class="small-note">Every plugin, every video. No catch.</span></div>
      <nav aria-label="Sections"><a href="#plugins">IngeTrazo plugins</a><a href="#videos">Watch</a><a href="#playlists">Playlists</a><a href="#library">All videos</a><a href="#links">Find me</a></nav>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="status" class="notice" hidden></div>

  <section id="videos" aria-labelledby="vh">
    <div class="sec-head">
      <div><div class="eyebrow">Watch</div><h2 id="vh">Videos</h2>
        <p class="sub">My layout, and the newest IngeTrazo plugin tutorial.</p></div>
      <div class="editbar" data-edit hidden><button class="btn" id="addVideo" type="button">+ Add video</button></div>
    </div>
    <div class="showcase">
      <div class="slot"><div class="slot-label">My layout</div><div id="slotLayout"></div></div>
      <div class="slot"><div class="slot-label">Latest plugin video</div><div id="slotPlugin"></div></div>
    </div>
  </section>

  <section id="plugins" aria-labelledby="ph">
    <div class="sec-head">
      <div><div class="eyebrow">Built for IngeTrazo</div><h2 id="ph">IngeTrazo plugins</h2>
        <p class="sub">Every plugin is built around IngeTrazo and <span class="free">every one is free</span>. Install them straight from IngeTrazo's approved extensions, or download them from GitHub.</p></div>
      <div class="editbar" data-edit hidden><button class="btn" id="addPlugin" type="button">+ Add plugin</button></div>
    </div>
    <div id="pluginGrid" class="plugins"></div>
    <div class="free-strip"><strong>All free. Always.</strong>
      <ul><li>No paid versions</li><li>Approved IngeTrazo extensions</li><li>Source on GitHub</li><li>Any scale</li></ul>
      <a class="btn small ghost" id="reportBtn" href="https://github.com/eddy-99/eddys-3d-plugins-ingetrazo/issues/new" target="_blank" rel="noopener">Found a problem? Report an issue</a></div>
  </section>

  <section id="playlists" aria-labelledby="plh">
    <div class="sec-head">
      <div><div class="eyebrow">On YouTube</div><h2 id="plh">Playlists</h2>
        <p class="sub">Every video on the channel, in its playlist. Open one to see the videos, or play the lot on YouTube.</p></div>
      <div class="editbar" data-edit hidden><button class="btn" id="addPlaylist" type="button">+ Add playlist</button></div>
    </div>
    <div id="plWrap"></div>
  </section>

  <section id="library" aria-labelledby="lh">
    <div class="sec-head">
      <div><div class="eyebrow">The library</div><h2 id="lh">All videos</h2>
        <p class="sub">Plugin tutorials, builds and printing how-tos, newest first.</p></div>
    </div>

        v.category === "plugins" ? el("span", {class:"badge free", text:"Free plugin"}) : null,
        v.date ? el("span", {text:fmtDate(v.date)}) : null),
      el("h3", {}, el("a", {href:url || "#", target:"_blank", rel:"noopener", text:v.title})),
      v.description ? el("p", {text:v.description}) : null,
      big ? el("div", {}, el("a", {class:"btn", href:url || "#", target:"_blank", rel:"noopener", text:"Watch on YouTube"})) : null
    );
    if (canEdit) body.append(adminRow("videos", v, () => openVideo(v)));
    return el("article", {class:"card"}, thumb, body);
  }

  function renderShowcase(){
    const layout = state.videos.find(v => v.featured);
    const latest = state.videos.filter(v => v.category === "plugins").sort(byNewest)[0];
    const fill = (id, v, emptyEdit, emptyView) => {
      const box = $(id); box.replaceChildren();
      if (v) box.append(videoCard(v, true));
      else box.append(el("div", {class:"empty"}, el("strong", {text: canEdit ? "Nothing here yet" : "Coming soon"}), canEdit ? emptyEdit : emptyView));
    };
    fill("#slotLayout", layout, "Add your layout video and tick “Show as My layout video”.", "A tour of the layout is on its way.");
    fill("#slotPlugin", latest, "Add a video in the IngeTrazo plugins section and it shows here.", "The next plugin tutorial is on its way.");
  }

  function renderVideos(){
    const grid = $("#videoGrid"); grid.replaceChildren();
    const counts = {all: state.videos.length, railway:0, plugins:0, modelling:0};
    state.videos.forEach(v => { if (counts[v.category] != null) counts[v.category]++; });
    for (const k in counts) $("#n-" + k).textContent = counts[k];
    const q = query.trim().toLowerCase();
    const list = state.videos.filter(v => (filter === "all" || v.category === filter) &&
      (!q || (v.title + " " + (v.description || "")).toLowerCase().includes(q))).sort(byNewest);
    if (!list.length){
      const msg = state.videos.length ? ["No videos match", "Try another section or clear the search."] :
        canEdit ? ["No videos yet", "Press “Add video”, paste a YouTube link, and it appears here for everyone."] :
                  ["Videos coming soon", "New plugin tutorials will appear here."];
      grid.append(el("div", {class:"empty", style:"grid-column:1/-1"}, el("strong", {text:msg[0]}), msg[1]));
      return;
    }
    for (const v of list) grid.append(videoCard(v));
  }

  function adminRow(coll, item, onEdit){
    const key = coll + "/" + item.id;
    if (confirming === key){
      return el("div", {class:"admin-row confirm"}, "Remove this for good?",
        el("button", {class:"btn small danger", type:"button", text:"Remove", onclick: () => removeItem(coll, item)}),
        el("button", {class:"btn small ghost", type:"button", text:"Keep", onclick: () => { confirming = null; renderAll(); }}));
    }
    return el("div", {class:"admin-row"},
      el("button", {class:"btn small ghost", type:"button", text:"Edit", onclick:onEdit}),
      el("button", {class:"btn small ghost", type:"button", text:"Remove", onclick: () => { confirming = key; renderAll(); }}));
  }

  async function removeItem(coll, item){
    if (saving) return;
    confirming = null;
    const before = state[coll];
    state[coll] = before.filter(x => x.id !== item.id);
    try { await save(); } catch (e) { state[coll] = before; status("Couldn't remove that: " + (e.message || e.code)); }
    renderAll();
  }

  /* ---------- Plugins ---------- */
  function renderPlugins(){
    const grid = $("#pluginGrid"); grid.replaceChildren();
    if (!state.plugins.length){
      grid.append(el("div", {class:"empty", style:"grid-column:1/-1"},
        el("strong", {text: canEdit ? "No plugins listed yet" : "Plugins coming soon"}), canEdit ? "Press “Add plugin” to list one." : ""));
      return;
    }
    const sorted = [...state.plugins].sort((a, b) => (a.order ?? 99) - (b.order ?? 99) || String(a.name).localeCompare(String(b.name)));
    for (const p of sorted){
      const gh = safeUrl(p.github || state.site.github), vid = safeUrl(p.video), it = safeUrl(state.site.ingetrazo), rep = issuesUrl(p.github || state.site.github);
      const card = el("article", {class:"plug"},
        el("div", {class:"plug-top"}, el("div", {class:"ico", "aria-hidden":"true", text:"E"}),
          el("div", {}, el("h3", {text:p.name}), el("span", {class:"ready", text:"For IngeTrazo · Free"}))),
        p.description ? el("p", {text:p.description}) : null,
        el("div", {class:"links"},
          gh ? el("a", {class:"btn small", href:gh, target:"_blank", rel:"noopener", text:"GitHub"}) : null,
          it ? el("a", {class:"btn small ghost", href:it, target:"_blank", rel:"noopener", text:"IngeTrazo extensions"}) : null,
          vid ? el("a", {class:"btn small ghost", href:vid, target:"_blank", rel:"noopener", text:"Watch tutorial"}) : null,
          rep ? el("a", {class:"btn small ghost", href:rep, target:"_blank", rel:"noopener", text:"Report an issue"}) : null)
      );
      if (canEdit) card.append(adminRow("plugins", p, () => openPlugin(p)));
      grid.append(card);
    }
  }

  /* ---------- Site ---------- */
  function renderSite(){
    const site = state.site;
    if (site.tagline) $("#tagline").textContent = site.tagline;
    if (site.intro) $("#intro").textContent = site.intro;
    { const r = issuesUrl(site.github); if (r) $("#reportBtn").href = r; }
    if (Array.isArray(site.logoTags) && site.logoTags.length){
      const tb = $("#logoTags"); tb.replaceChildren();
      for (const t of site.logoTags){
        const [txt, link] = String(t).split("|").map(s => s.trim());
        if (!txt) continue;
        const u = safeUrl(link || "");
        tb.append(u ? el("a", {class:"logo-tag", href:u, target:"_blank", rel:"noopener", text:txt}) : el("span", {class:"logo-tag", text:txt}));
      }
    }
    const box = $("#siteLinks"); box.replaceChildren();
    const items = [["youtube","YouTube channel",true],["github","GitHub"],["ingetrazo","IngeTrazo extensions"],["facebook","Facebook"]];
    let any = false;
    for (const [k, label, primary] of items){
      const u = safeUrl(site[k]); if (!u) continue; any = true;
      box.append(el("a", {class:"btn" + (primary ? "" : " ghost"), href:u, target:"_blank", rel:"noopener", text:label}));
    }
    if (!any) box.append(el("span", {class:"sub", text: canEdit ? "Add your channel and GitHub links with the button below." : "Links coming soon."}));
  }

  function renderAll(){
    document.querySelectorAll("[data-edit]").forEach(n => n.hidden = !canEdit);
    renderShowcase(); renderVideos(); renderPlugins(); renderSite(); renderPlaylists();
  }

  /* ---------- Thumbnails: shrink to 640×360 and keep inside the page ---------- */
  function shrinkImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image(); const url = URL.createObjectURL(file);
      img.onload = () => {
        const W = 640, H = 360, c = document.createElement("canvas"); c.width = W; c.height = H;
        const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
        c.getContext("2d").drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        URL.revokeObjectURL(url); resolve(c.toDataURL("image/jpeg", 0.78));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject({message:"That file isn't an image I can read."}); };
      img.src = url;
    });
  }

  /* ---------- Dialogs ---------- */
  let editingVideo = null, pendingThumb = null, editingPlugin = null;
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));

  function openVideo(v){
    editingVideo = v || null; pendingThumb = null;
    $("#dvTitle").textContent = v ? "Edit video" : "Add video";
    $("#v-title").value = v?.title || ""; $("#v-url").value = v?.url || "";
    $("#v-cat").value = v?.category || (filter !== "all" ? filter : "plugins");
    $("#v-date").value = v?.date || new Date().toISOString().slice(0,10);
    $("#v-desc").value = v?.description || ""; $("#v-feat").checked = !!v?.featured;
    $("#v-thumb").value = ""; $("#v-err").textContent = "";
    const pv = $("#v-thumbprev"), img = safeImg(v?.thumb);
    if (img){ pv.src = img; pv.hidden = false; } else { pv.hidden = true; pv.removeAttribute("src"); }
    $("#dlgVideo").showModal();
  }
  $("#v-thumb").addEventListener("change", async e => {
    const f = e.target.files[0]; pendingThumb = null; if (!f) return;
    try { pendingThumb = await shrinkImage(f); const pv = $("#v-thumbprev"); pv.src = pendingThumb; pv.hidden = false; $("#v-err").textContent = ""; }
    catch (err){ $("#v-err").textContent = err.message; }
  });
  $("#fVideo").addEventListener("submit", async e => {
    e.preventDefault(); if (saving) return;
    const url = safeUrl($("#v-url").value.trim());
    if (!url){ $("#v-err").textContent = "Paste the full YouTube link, starting with https://"; return; }
    const btn = $("#v-save"); btn.disabled = true; btn.textContent = "Saving…";
    const before = state.videos;
    const item = {id: editingVideo?.id || newId(), title:$("#v-title").value.trim(), url, category:$("#v-cat").value, date:$("#v-date").value,
      description:$("#v-desc").value.trim(), featured:$("#v-feat").checked, thumb: pendingThumb || editingVideo?.thumb || null};
    let list = before.map(x => item.featured && x.featured ? {...x, featured:false} : x);
    list = editingVideo ? list.map(x => x.id === item.id ? item : x) : [...list, item];
    state.videos = list;
    try { await save(); $("#dlgVideo").close(); }
    catch (err){ state.videos = before; $("#v-err").textContent = "Couldn't save: " + (err?.message || err?.code || err); }
    finally { btn.disabled = false; btn.textContent = "Save video"; renderAll(); }
  });

  function openPlugin(p){
    editingPlugin = p || null;
    $("#dpTitle").textContent = p ? "Edit plugin" : "Add plugin";
    $("#p-name").value = p?.name || ""; $("#p-desc").value = p?.description || "";
    $("#p-gh").value = p?.github || ""; $("#p-vid").value = p?.video || ""; $("#p-err").textContent = "";
    $("#dlgPlugin").showModal();
  }
  $("#fPlugin").addEventListener("submit", async e => {
    e.preventDefault(); if (saving) return;
    const before = state.plugins;
    const item = {id: editingPlugin?.id || newId(), name:$("#p-name").value.trim(), description:$("#p-desc").value.trim(),
      github:$("#p-gh").value.trim(), video:$("#p-vid").value.trim(), order: editingPlugin?.order ?? before.length + 1};
    state.plugins = editingPlugin ? before.map(x => x.id === item.id ? item : x) : [...before, item];
    try { await save(); $("#dlgPlugin").close(); }
    catch (err){ state.plugins = before; $("#p-err").textContent = "Couldn't save: " + (err?.message || err?.code); }
    renderAll();
  });

  $("#editSite").addEventListener("click", () => {
    const site = state.site;
    $("#s-tag").value = site.tagline || $("#tagline").textContent; $("#s-intro").value = site.intro || $("#intro").textContent;
    $("#s-tags").value = (site.logoTags || []).join("\n");
    $("#s-yt").value = site.youtube || ""; $("#s-gh").value = site.github || "";
    $("#s-it").value = site.ingetrazo || ""; $("#s-fb").value = site.facebook || ""; $("#s-err").textContent = "";
    $("#dlgSite").showModal();
  });
  $("#fSite").addEventListener("submit", async e => {
    e.preventDefault(); if (saving) return;
    const before = state.site;
    state.site = {tagline:$("#s-tag").value.trim(), intro:$("#s-intro").value.trim(),
      logoTags:$("#s-tags").value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 8), youtube:$("#s-yt").value.trim(),
      github:$("#s-gh").value.trim(), ingetrazo:$("#s-it").value.trim(), facebook:$("#s-fb").value.trim()};
    try { await save(); $("#dlgSite").close(); }
    catch (err){ state.site = before; $("#s-err").textContent = "Couldn't save: " + (err?.message || err?.code); }
    renderAll();
  });
  $("#addVideo").addEventListener("click", () => openVideo(null));
  $("#addPlugin").addEventListener("click", () => openPlugin(null));

  /* ---------- Playlists ---------- */
  const GROUPS = [["plugins","IngeTrazo plugins"],["railway","Layout & builds"],["modelling","Modelling & printing"]];
  const plId = u => { try { return new URL(u).searchParams.get("list"); } catch { return null; } };
  const cleanId = id => /^[A-Za-z0-9_-]+$/.test(String(id || "")) ? id : null;
  function renderPlaylists(){
    const wrap = $("#plWrap"); wrap.replaceChildren();
    const all = state.playlists || [];
    if (!all.length){ wrap.append(el("div", {class:"empty"}, el("strong", {text:"Playlists coming soon"}))); return; }
    for (const [cat, label] of GROUPS){
      const list = all.filter(p => p.category === cat);
      if (!list.length) continue;
      const grid = el("div", {class:"pl-grid"});
      for (const p of list){
        const lid = cleanId(p.id); if (!lid) continue;
        const vids = Array.isArray(p.videos) ? p.videos : [];
        const playAll = "https://www.youtube.com/playlist?list=" + lid;
        const det = el("details", {class:"pl"},
          el("summary", {},
            el("div", {class:"stack", "aria-hidden":"true", text: vids.length ? String(vids.length) : "▶"}),
            el("div", {}, el("div", {class:"pt", text:p.title}),
              el("div", {class:"pd", text: (vids.length ? vids.length + (vids.length === 1 ? " video" : " videos") : "Playlist") + (p.description ? " · " + p.description : "")})),
            el("span", {class:"chev", "aria-hidden":"true"})),
          vids.length ? el("ol", {}, vids.map(([vid, t]) => cleanId(vid) ? el("li", {}, el("a", {href:"https://www.youtube.com/watch?v=" + vid + "&list=" + lid, target:"_blank", rel:"noopener", text:t})) : null)) : null,
          el("div", {class:"pfoot"}, el("a", {class:"btn small", href:playAll, target:"_blank", rel:"noopener", text:"Play all on YouTube"}),
            canEdit ? adminRow("playlists", p, () => openPlaylist(p)) : null));
        grid.append(det);
      }
      wrap.append(el("div", {class:"pl-group"}, el("h3", {class:"grp", text:label}), grid));
    }
  }
  let editingPlaylist = null;
  function openPlaylist(p){
    editingPlaylist = p || null;
    $("#dlTitle").textContent = p ? "Edit playlist" : "Add playlist";
    $("#l-title").value = p?.title || ""; $("#l-url").value = p ? "https://www.youtube.com/playlist?list=" + p.id : "";
    $("#l-cat").value = p?.category || "plugins"; $("#l-desc").value = p?.description || ""; $("#l-err").textContent = "";
    $("#dlgPlaylist").showModal();
  }
  $("#fPlaylist").addEventListener("submit", async e => {
    e.preventDefault(); if (saving) return;
    const id = cleanId(plId($("#l-url").value.trim()));
    if (!id){ $("#l-err").textContent = "Paste the playlist link. It has list= in it."; return; }
    const before = state.playlists || [];
    const keep = editingPlaylist && editingPlaylist.id === id ? editingPlaylist.videos : [];
    const item = {id, title:$("#l-title").value.trim(), category:$("#l-cat").value, description:$("#l-desc").value.trim(), videos: keep || []};
    state.playlists = editingPlaylist ? before.map(x => x.id === editingPlaylist.id ? item : x) : [...before, item];
    try { await save(); $("#dlgPlaylist").close(); }
    catch (err){ state.playlists = before; $("#l-err").textContent = "Couldn't save: " + (err?.message || err?.code); }
    renderAll();
  });
  $("#addPlaylist").addEventListener("click", () => openPlaylist(null));

  /* ---------- Filters ---------- */
  document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
    filter = c.dataset.f;
    document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === c)));
    renderVideos();
  }));
  $("#q").addEventListener("input", e => { query = e.target.value; renderVideos(); });

  renderAll();

  /* ---------- Editing controls appear only for Eddy ---------- */
  (async () => {
    if (!window.claude?.use) return;
    const [a, u] = await Promise.all([claude.use("artifact"), claude.use("user")]);
    artifact = a;
    try { canEdit = !!(a && u && await u.isOwner()); } catch { canEdit = false; }
    if (canEdit) renderAll();
  })();
})();
</script>

</body></html>
